name: Build Windows x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cl.exe /nologo /std:c++20 /EHsc /W4 /DUNICODE /D_UNICODE /Fe:crossfire_esp.exe crossfire_esp.cpp /link User32.lib Gdi32.lib Advapi32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: crossfire-esp-windows-x64
          path: crossfire_esp.exe
