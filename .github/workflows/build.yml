name: Build Offset Scanner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: cl.exe /nologo /std:c++20 /EHsc /W4 /Fe:offset_scanner.exe offset_scanner.cpp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: offset-scanner-windows-x64
          path: offset_scanner.exe
          if-no-files-found: error
